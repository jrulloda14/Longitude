name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Time zone bugs are easiest to fix with exact cities, dates and times.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add Manila and New York
        2. Drag the clock to 1:30 AM on Sun 1 Nov
        3. ...
  - type: input
    id: version
    attributes:
      label: Longitude version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows 11, Windows 10, macOS (Apple Silicon), macOS (Intel), Other]
    validations:
      required: true
  - type: input
    id: osversion
    attributes:
      label: OS version
      placeholder: "e.g. Windows 11 24H2, macOS 15.1"
