name: Windows CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      LONGITUDE_SKIP_GOLDENS: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24.15.0'
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt
          rustup override set 1.99.0
      - run: npm ci
      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test
      - name: Rust format and tests
        shell: bash
        run: |
          npm run desktop:frontend
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Browser interaction tests (Microsoft Edge; screenshot goldens run on the reference host)
        run: npm run test:browser
      - name: Build Windows installer (unsigned development build)
        run: npm run desktop:build
      - name: Keep installer for 14 days (not a release)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Longitude-windows-x64-development
          retention-days: 14
          if-no-files-found: error
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
