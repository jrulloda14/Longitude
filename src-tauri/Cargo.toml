[package]
name = "longitude"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-single-instance = "=2.5.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
# Selected by the macOS config only. A named app feature survives Tauri CLI's
# automatic rewriting of direct dependency features during Windows builds.
macos-transparency = ["tauri/macos-private-api"]

[profile.release]
lto = true
codegen-units = 1
strip = true
